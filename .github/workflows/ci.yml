name: CI

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

jobs:
  backend:
    name: Backend - Build e Testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore backend/Fraga.slnx

      - name: Build
        run: dotnet build backend/Fraga.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test backend/Fraga.slnx --configuration Release --no-build
